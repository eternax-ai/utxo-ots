[package]
name = "spend_to_sign"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.32", features = ["bitcoinconsensus", "std"] }
bitcoinconsensus = "0.105.0"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
hmac = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
